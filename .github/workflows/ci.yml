# Deterministic checks without cloud secrets. Workspace integration stays opt-in and manual.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --locked
      - run: uv run ruff check src tests scripts portfolio jobs
      - run: uv run pytest -q
      - run: uv build --quiet
